
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quickserve-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: quickserve.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quickserve
                port:
                  number: 80
