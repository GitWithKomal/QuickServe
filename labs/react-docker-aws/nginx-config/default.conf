server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Everything is a 404
        root /var/www/localhost/htdocs;
        index index.html;

        location / {
                try_files $uri $uri/ =404;
        }

        # You may need this to prevent return 404 recursion.
        location = /404.html {
                internal;
        }
}