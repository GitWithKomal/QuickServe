---
- name: Install and configure NGINX on slave
  hosts: ansibleslave
  become: true

  tasks:
    - name: Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Configure NGINX IPv4 listener
      ansible.builtin.lineinfile:
        path: /etc/nginx/sites-available/default
        regexp: '^\s*listen (80|8080|8081) default_server;'
        line: '        listen 8080 default_server;'
      notify: Reload NGINX

    - name: Configure NGINX IPv6 listener
      ansible.builtin.lineinfile:
        path: /etc/nginx/sites-available/default
        regexp: '^\s*listen \[::\]:(80|8080|8081) default_server;'
        line: '        listen [::]:8080 default_server;'
      notify: Reload NGINX

    - name: Validate NGINX configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Ensure NGINX is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload NGINX
      ansible.builtin.service:
        name: nginx
        state: reloaded