apiVersion: apps/v1
kind: Deployment
metadata:
  name: quickserve
  namespace: development
spec:
  replicas: 3
  selector:
    matchLabels:
      app: quickserve
  template:
    metadata:
      labels:
        app: quickserve
    spec:
      containers:
        - name: quickserve
          image: ghcr.io/gitwithkomal/quickserve:9b650033cb12912da6f0d7656cc4f43115b3350a
          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: quickserve-config
                  key: APP_ENV
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quickserve-secret
                  key: DB_PASSWORD